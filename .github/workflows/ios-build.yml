name: iOS Build and Upload

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest'
        
    - name: Install Apple Certificate
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      run: |
        echo $BUILD_CERTIFICATE_BASE64 | base64 --decode > certificate.p12
        security create-keychain -p "" build.keychain
        security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -A
        security list-keychains -s build.keychain
        
    - name: Build and Archive
      run: |
        xcodebuild -project SnapPlus-App.xcodeproj -scheme SnapPlus-App -archivePath SnapPlus.xcarchive archive
        
    - name: Export IPA
      run: |
        xcodebuild -exportArchive -archivePath SnapPlus.xcarchive -exportOptionsPlist exportOptions.plist -exportPath output/
        
    - name: Upload to App Store Connect
      env:
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      run: |
        xcrun altool --upload-app -f output/SnapPlus.ipa -u "${{ secrets.APPLE_ID }}" -p "$APPLE_ID_PASSWORD"
